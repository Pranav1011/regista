[project]
name = "regista"
version = "0.0.1"
description = "Football match intelligence: video -> tracking -> tactical analytics -> analyst agent"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{ name = "Sai Pranav Krovvidi" }]
dependencies = [
  "kloppy",
  "numpy",
  "pandas>=2.2",
  "pyarrow",
  "scipy",
  "matplotlib",
  "mplsoccer",
  "typer",
  "duckdb",
  "pydantic>=2",
]

[project.scripts]
regista = "regista.cli:app"

[project.optional-dependencies]
# Phase 3. Both detectors are installed so they can be benchmarked head to head.
vision = ["ultralytics", "rfdetr", "supervision", "opencv-python-headless"]
# Phase 2: MCP server, local agent loop (Ollama), local viewer server
agent = ["mcp", "ollama", "fastapi", "uvicorn"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regista"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options through default values; these calls are safe.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
